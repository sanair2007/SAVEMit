[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "savemit-mcp"
version = "0.1.0"
description = "Deterministic dependency-vulnerability investigation and validation MCP server"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=3,<4",
  "httpx>=0.27,<1",
]

[project.scripts]
savemit-mcp = "app.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["app", "app.agents", "app.coordinator", "app.mcp", "app.models", "app.services"]
